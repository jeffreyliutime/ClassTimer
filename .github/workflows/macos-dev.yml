name: ClassTimer Mac development build
on:
  push:
    branches: [dev/macos-2.6]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test and build Apple Silicon app
        run: bash ClassTimer_Mac_2.6/Build-Mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClassTimer-Mac-2.6-AppleSilicon
          path: ClassTimer_Mac_2.6/build/ClassTimer_Mac_2.6_AppleSilicon.zip
          if-no-files-found: error
