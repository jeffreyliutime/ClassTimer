<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">ClassTimer interface preview</title>
<desc id="desc">Illustrative preview of the ClassTimer instructor console and floating student timer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef4fb"/><stop offset="1" stop-color="#dce6f2"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#222a36"/><stop offset="1" stop-color="#141a23"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1677ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1c2a3a" flood-opacity=".22"/></filter>
  <style>
    .ui{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    .muted{fill:#aab5c4}.white{fill:#f8fafc}.label{font-size:17px;fill:#dce4ee}
    .btn{fill:#3a4657;stroke:#59677b;stroke-width:1}.small{font-size:14px}
  </style>
</defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="58" y="66" class="ui" font-size="34" font-weight="750" fill="#172235">ClassTimer</text>
<text x="60" y="98" class="ui" font-size="16" fill="#526174">A floating classroom timer · Instructor console + student display</text>
<g filter="url(#shadow)">
  <rect x="50" y="130" width="1100" height="455" rx="18" fill="url(#panel)" stroke="#526174" stroke-width="2"/>
  <rect x="50" y="130" width="1100" height="48" rx="18" fill="#e9eef5"/>
  <rect x="50" y="158" width="1100" height="20" fill="#e9eef5"/>
  <circle cx="78" cy="154" r="9" fill="#2563eb"/>
  <path d="M78 148v7l5 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="100" y="161" class="ui" font-size="17" font-weight="650" fill="#1b2737">ClassTimer · Instructor Console</text>
  <rect x="78" y="198" width="310" height="118" rx="13" fill="#2c3543" stroke="#465365"/>
  <text x="233" y="278" text-anchor="middle" class="ui white" font-size="74" font-weight="750" letter-spacing="2">15:00</text>
  <text x="233" y="300" text-anchor="middle" class="ui muted small">READY · SEGMENT 1</text>
  <rect x="414" y="198" width="155" height="58" rx="10" fill="url(#blue)"/>
  <text x="491" y="235" text-anchor="middle" class="ui white" font-size="21" font-weight="650">▶ Start</text>
  <rect x="583" y="198" width="155" height="58" rx="10" class="btn"/>
  <text x="660" y="235" text-anchor="middle" class="ui white" font-size="21">Ⅱ Pause</text>
  <rect x="752" y="198" width="155" height="58" rx="10" fill="#9f3037"/>
  <text x="829" y="235" text-anchor="middle" class="ui white" font-size="21">↻ Reset</text>
  <rect x="921" y="198" width="198" height="58" rx="10" class="btn"/>
  <text x="1020" y="235" text-anchor="middle" class="ui white" font-size="21">⟳ Loop</text>
  <rect x="414" y="270" width="340" height="46" rx="9" class="btn"/>
  <text x="584" y="300" text-anchor="middle" class="ui white" font-size="18">＋  Add 1 minute</text>
  <rect x="768" y="270" width="351" height="46" rx="9" class="btn"/>
  <text x="943" y="300" text-anchor="middle" class="ui white" font-size="18">－  Subtract 1 minute</text>
  <rect x="78" y="340" width="500" height="205" rx="12" fill="#1b222d" stroke="#59677b"/>
  <text x="102" y="374" class="ui label" font-weight="650">Segment settings · up to 6 segments</text>
  <text x="104" y="417" class="ui muted small">Number of segments</text>
  <rect x="300" y="390" width="90" height="38" rx="6" fill="#f8fafc"/>
  <text x="326" y="416" class="ui" font-size="20" fill="#172235">1</text>
  <path d="M365 400l8-7 8 7M365 417l8 7 8-7" fill="none" stroke="#4b5563" stroke-width="2"/>
  <text x="104" y="472" class="ui muted small">Class session</text>
  <rect x="224" y="444" width="170" height="42" rx="6" fill="#f8fafc"/>
  <text x="245" y="472" class="ui" font-size="20" fill="#172235">15</text>
  <text x="407" y="472" class="ui label">minutes</text>
  <rect x="104" y="505" width="440" height="25" rx="6" fill="#3a4657"/>
  <text x="324" y="523" text-anchor="middle" class="ui white small">＋ Apply segment times</text>
  <rect x="598" y="340" width="521" height="205" rx="12" fill="#1b222d" stroke="#59677b"/>
  <text x="622" y="374" class="ui label" font-weight="650">Projection &amp; student display</text>
  <text x="622" y="415" class="ui muted small">Display</text>
  <rect x="752" y="390" width="340" height="38" rx="6" fill="#f8fafc"/>
  <text x="772" y="415" class="ui" font-size="17" fill="#172235">Screen 2 · External display</text>
  <text x="622" y="467" class="ui muted small">Student window</text>
  <rect x="752" y="442" width="150" height="40" rx="7" class="btn"/>
  <text x="827" y="468" text-anchor="middle" class="ui white small">Move to screen</text>
  <rect x="914" y="442" width="178" height="40" rx="7" class="btn"/>
  <text x="1003" y="468" text-anchor="middle" class="ui white small">Show / hide</text>
  <rect x="752" y="495" width="340" height="32" rx="6" fill="#2b3543"/>
  <text x="922" y="517" text-anchor="middle" class="ui muted small">Size · Theme · Mode · Reminder text</text>
</g>
<g filter="url(#shadow)">
  <rect x="850" y="485" width="300" height="125" rx="14" fill="#0e5139" stroke="#fff" stroke-width="4"/>
  <text x="1000" y="525" text-anchor="middle" class="ui" font-size="16" fill="#d5f3e5">STUDENT DISPLAY</text>
  <text x="1000" y="583" text-anchor="middle" class="ui" font-size="56" font-weight="750" fill="#fff">15:00</text>
</g>
<text x="60" y="618" class="ui" font-size="13" fill="#526174">Illustrative interface preview · Exact appearance may vary by platform and version.</text>
</svg>