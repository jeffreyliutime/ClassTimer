<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">ClassTimer product interface overview</title>
<desc id="desc">Illustrative ClassTimer instructor console with timer controls, segment settings, reminder text controls, and a student projection display showing the reminder directly above the countdown.</desc>
<defs>
  <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#e5edf6"/></linearGradient>
  <linearGradient id="console" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#252e3b"/><stop offset="1" stop-color="#171e28"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14583e"/><stop offset="1" stop-color="#0b402d"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2478ed"/><stop offset="1" stop-color="#3165d5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#25364a" flood-opacity=".18"/></filter>
  <style>
    .ui{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .ink{fill:#192638}.muted{fill:#aeb9c8}.white{fill:#f8fafc}.soft{fill:#dce5ef}
    .section{font-size:18px;font-weight:700;fill:#e7edf5}.tiny{font-size:13px}.small{font-size:15px}
    .btn{fill:#3b4758;stroke:#59677a;stroke-width:1}.field{fill:#313d4c;stroke:#59677a;stroke-width:1}
  </style>
</defs>
<rect width="1400" height="900" rx="28" fill="url(#page)"/>
<text x="62" y="70" class="ui ink" font-size="39" font-weight="780">ClassTimer</text>
<text x="64" y="108" class="ui" font-size="18" fill="#536477">Floating classroom timer · Instructor control + student display + on-screen prompts</text>
<rect x="1045" y="48" width="290" height="42" rx="21" fill="#e1ebf8"/>
<text x="1190" y="75" text-anchor="middle" class="ui" font-size="15" font-weight="650" fill="#245ca7">WINDOWS  ·  macOS</text>

<!-- Instructor console -->
<g filter="url(#shadow)">
  <rect x="55" y="150" width="790" height="690" rx="20" fill="url(#console)" stroke="#4a586a" stroke-width="2"/>
  <rect x="55" y="150" width="790" height="54" rx="20" fill="#e9eef5"/>
  <rect x="55" y="180" width="790" height="24" fill="#e9eef5"/>
  <circle cx="84" cy="177" r="9" fill="#316bdc"/>
  <path d="M84 170v8l6 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="108" y="184" class="ui" font-size="18" font-weight="700" fill="#1c2939">ClassTimer · 讲师控制台</text>
  <text x="810" y="183" text-anchor="end" class="ui" font-size="13" fill="#526174">控制端示意</text>

  <rect x="82" y="230" width="295" height="125" rx="14" fill="#303b4a" stroke="#4d5b6e"/>
  <text x="229" y="310" text-anchor="middle" class="ui white" font-size="76" font-weight="760" letter-spacing="2">15:00</text>
  <text x="229" y="338" text-anchor="middle" class="ui muted tiny">已暂停 · 第 2 段</text>

  <rect x="400" y="230" width="120" height="52" rx="9" fill="url(#blue)"/>
  <text x="460" y="263" text-anchor="middle" class="ui white" font-size="18" font-weight="700">开始</text>
  <rect x="532" y="230" width="120" height="52" rx="9" class="btn"/>
  <text x="592" y="263" text-anchor="middle" class="ui white" font-size="18">暂停</text>
  <rect x="664" y="230" width="150" height="52" rx="9" class="btn"/>
  <text x="739" y="263" text-anchor="middle" class="ui white" font-size="18">重置</text>
  <rect x="400" y="294" width="194" height="45" rx="8" class="btn"/>
  <text x="497" y="322" text-anchor="middle" class="ui white" font-size="16">循环：关</text>
  <rect x="606" y="294" width="100" height="45" rx="8" class="btn"/>
  <text x="656" y="322" text-anchor="middle" class="ui white" font-size="16">＋1 分钟</text>
  <rect x="718" y="294" width="96" height="45" rx="8" class="btn"/>
  <text x="766" y="322" text-anchor="middle" class="ui white" font-size="16">－1 分钟</text>

  <!-- Segment editor -->
  <rect x="82" y="380" width="330" height="260" rx="13" fill="#1d2631" stroke="#566477"/>
  <text x="105" y="416" class="ui section">计时段设置</text>
  <text x="105" y="450" class="ui muted small">段数</text>
  <rect x="190" y="428" width="70" height="36" rx="6" fill="#f0f3f7"/>
  <text x="211" y="452" class="ui ink" font-size="18">3</text>
  <path d="M240 439l6-5 6 5M240 453l6 5 6-5" fill="none" stroke="#435064" stroke-width="2"/>
  <text x="105" y="504" class="ui muted small">第 2 段 · 小组讨论</text>
  <rect x="105" y="520" width="78" height="42" rx="6" class="field"/>
  <text x="144" y="547" text-anchor="middle" class="ui white" font-size="18">00</text>
  <text x="190" y="547" class="ui soft small">小时</text>
  <rect x="235" y="520" width="78" height="42" rx="6" class="field"/>
  <text x="274" y="547" text-anchor="middle" class="ui white" font-size="18">15</text>
  <text x="320" y="547" class="ui soft small">分钟</text>
  <rect x="105" y="580" width="78" height="38" rx="6" class="field"/>
  <text x="144" y="605" text-anchor="middle" class="ui white" font-size="17">00</text>
  <text x="190" y="605" class="ui soft small">秒</text>
  <rect x="248" y="580" width="142" height="38" rx="7" class="btn"/>
  <text x="319" y="605" text-anchor="middle" class="ui white tiny">应用段落时间</text>

  <!-- Display and reminder settings -->
  <rect x="432" y="380" width="382" height="260" rx="13" fill="#1d2631" stroke="#566477"/>
  <text x="456" y="416" class="ui section">投影和学员窗口</text>
  <text x="456" y="453" class="ui muted small">显示屏幕</text>
  <rect x="565" y="430" width="225" height="38" rx="6" fill="#eef2f7"/>
  <text x="580" y="455" class="ui ink small">屏幕 2 · 外接投影</text>
  <rect x="456" y="482" width="158" height="38" rx="7" class="btn"/>
  <text x="535" y="507" text-anchor="middle" class="ui white tiny">移动到所选屏幕</text>
  <rect x="626" y="482" width="164" height="38" rx="7" class="btn"/>
  <text x="708" y="507" text-anchor="middle" class="ui white tiny">显示／隐藏学员端</text>
  <text x="456" y="553" class="ui muted small">提醒文字</text>
  <rect x="565" y="530" width="225" height="42" rx="6" fill="#f1f4f8"/>
  <text x="578" y="557" class="ui" font-size="14" fill="#1d2a3a">请完成小组讨论并准备汇报</text>
  <rect x="565" y="582" width="105" height="38" rx="7" fill="url(#blue)"/>
  <text x="617" y="607" text-anchor="middle" class="ui white tiny" font-weight="700">显示文字</text>
  <rect x="680" y="582" width="110" height="38" rx="7" class="btn"/>
  <text x="735" y="607" text-anchor="middle" class="ui white tiny">清除文字</text>

  <rect x="82" y="660" width="732" height="145" rx="13" fill="#202a36" stroke="#4b596b"/>
  <text x="108" y="698" class="ui section">讲师控制，学员可见</text>
  <text x="108" y="734" class="ui soft" font-size="16">输入阶段任务或课堂提醒，一键显示在学员端计时画面上。</text>
  <text x="108" y="770" class="ui muted small">计时、任务提示与投影显示在同一套流程中完成。</text>
</g>

<!-- Student display -->
<g filter="url(#shadow)">
  <rect x="890" y="150" width="455" height="565" rx="20" fill="#111a22" stroke="#fff" stroke-width="5"/>
  <rect x="896" y="156" width="443" height="553" rx="15" fill="url(#screen)"/>
  <text x="1117" y="208" text-anchor="middle" class="ui" font-size="16" font-weight="650" fill="#ccebdd" letter-spacing="1">学员端 · 投影显示</text>
  <rect x="955" y="246" width="325" height="112" rx="12" fill="#ffffff" fill-opacity=".10" stroke="#bdebd4" stroke-opacity=".42"/>
  <text x="1117" y="283" text-anchor="middle" class="ui" font-size="15" fill="#ccebdd">本阶段任务提示</text>
  <text x="1117" y="322" text-anchor="middle" class="ui" font-size="22" font-weight="700" fill="#ffffff">请完成小组讨论</text>
  <text x="1117" y="351" text-anchor="middle" class="ui" font-size="15" fill="#e0f4e9">并准备好你们的汇报</text>
  <text x="1117" y="470" text-anchor="middle" class="ui" font-size="104" font-weight="780" fill="#ffffff" letter-spacing="1">15:00</text>
  <text x="1117" y="518" text-anchor="middle" class="ui" font-size="16" fill="#ccebdd">第 2 段 · 小组讨论</text>
  <rect x="1020" y="575" width="194" height="2" rx="1" fill="#d4f2e2" fill-opacity=".5"/>
  <text x="1117" y="617" text-anchor="middle" class="ui" font-size="14" fill="#d4f2e2">提示文字与倒计时同屏显示</text>
</g>
<path d="M814 553 C850 553 850 300 947 300" fill="none" stroke="#3476dc" stroke-width="3" stroke-dasharray="7 7"/>
<circle cx="814" cy="553" r="5" fill="#3476dc"/>
<circle cx="947" cy="300" r="5" fill="#3476dc"/>
<rect x="910" y="755" width="415" height="74" rx="13" fill="#e6eef9" stroke="#cbd9ea"/>
<text x="1117" y="785" text-anchor="middle" class="ui" font-size="17" font-weight="750" fill="#245ca7">不只是显示时间</text>
<text x="1117" y="811" text-anchor="middle" class="ui" font-size="15" fill="#43556c">还把讲师的任务指令直接带到学员面前</text>
<text x="62" y="876" class="ui" font-size="13" fill="#68788b">Illustrative product UI · Interface details may vary by operating system and release.</text>
</svg>